<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta 4 — Cuestionario de satisfacción | Arturo Alba</title>
    <link rel="icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="quiz quiz--q4" data-question="4">

<a href="index.html" class="quiz__restart">
    <span class="quiz__restart-arrow" aria-hidden="true">←</span>
    <span>Volver a empezar</span>
</a>

<div class="quiz__panel quiz__panel--visual">
    <img
            src="assets/images/encuesta-3-formador.png"
            alt=""
            class="quiz__visual-image"
            onerror="this.hidden=true">
</div>

<main class="quiz__panel quiz__panel--question">
    <div class="quiz__content">
        <p class="quiz__kicker">4 / 6</p>
        <h1 class="quiz__question">¿Cómo valoras la claridad y el dominio del formador?</h1>

        <ul class="quiz__scale" role="listbox" aria-label="Claridad y dominio del formador de 1 a 10">
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="1" role="option" aria-selected="false">1</button></li>
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="2" role="option" aria-selected="false">2</button></li>
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="3" role="option" aria-selected="false">3</button></li>
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="4" role="option" aria-selected="false">4</button></li>
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="5" role="option" aria-selected="false">5</button></li>
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="6" role="option" aria-selected="false">6</button></li>
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="7" role="option" aria-selected="false">7</button></li>
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="8" role="option" aria-selected="false">8</button></li>
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="9" role="option" aria-selected="false">9</button></li>
            <li role="presentation"><button type="button" class="quiz__scale-btn" data-value="10" role="option" aria-selected="false">10</button></li>
        </ul>
        <p class="quiz__scale-legend"><span>1 = muy baja</span><span>10 = muy alta</span></p>
    </div>

    <a href="pregunta-5.html" class="quiz__next" id="nextBtn" aria-disabled="true">
        <span>SIGUIENTE</span>
        <span class="quiz__next-arrow" aria-hidden="true">→</span>
    </a>
</main>

<script src="js/survey.js"></script>
</body>
</html>
